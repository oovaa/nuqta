<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order | NUQTA Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="navbar">
      <a class="logo" href="index.html"><img src="images/logo.svg" alt="NUQTA home"></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Products</a></li>
        <li><a href="trade-in.html">Sell Laptop</a></li>
        <li><a href="about.html">About us</a></li>
      </ul>
      <div class="nav-actions">
        <form id="search-form" class="search-form" role="search" method="get" action="shop.html">
          <label for="search-input" class="visually-hidden">Search products</label>
          <input id="search-input" type="search" name="q">
        </form>
        <a class="header-pill" href="cart.html" aria-label="Shopping cart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.5"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><span id="cart-count">(0)</span></a>
        <a class="header-pill" id="account-link" href="login.html">Log in</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="track-login-needed" hidden>
        <p class="empty-state">Please <a href="login.html?next=track.html">log in</a> to track your orders.</p>
      </div>

      <div id="track-content">
        <h1 class="page-title">Track Order Status</h1>
        <div id="track-box">
          <p>Loading order tracking details...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bar">
      <a href="index.html"><img src="images/logo-white.svg" alt="NUQTA home" width="185" height="36"></a>
      <p>Copyright &copy; 2026 NUQTA.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      startTrackPage();
    });
  </script>
</body>
</html>
