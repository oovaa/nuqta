<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping cart | NUQTA Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="navbar">
      <a class="logo" href="index.html"><img src="images/logo.svg" alt="NUQTA home"></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Products</a></li>
        <li><a href="trade-in.html">Sell Laptop</a></li>
        <li><a href="about.html">About us</a></li>
      </ul>
      <div class="nav-actions">
        <form id="search-form" class="search-form" role="search" method="get" action="shop.html">
          <label for="search-input" class="visually-hidden">Search products</label>
          <input id="search-input" type="search" name="q">
        </form>
        <a class="header-pill" href="cart.html" aria-label="Shopping cart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.5"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><span id="cart-count">(0)</span></a>
        <a class="header-pill" id="account-link" href="login.html">Log in</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <p class="steps" style="margin-top:-75px"><span class="current">Cart</span> &rarr; Shipping &rarr; Payment &rarr; Done</p>
      <div class="two-columns">
        <div>
          <h1 class="page-title">Shopping cart</h1>
          <div id="cart-items">
            <p>Loading cart...</p>
          </div>
        </div>

        <aside class="panel summary" id="cart-summary" aria-label="Order summary">
          <h2>Order summary</h2>
          <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">0 USD</span></div>
          <div class="summary-row"><span>Shipping</span><span id="cart-shipping">0 USD</span></div>
          <div class="summary-row total"><span>Total</span><span id="cart-total">0 USD</span></div>
          <a class="btn btn-primary btn-large" href="checkout.html" id="checkout-button">Checkout</a>
          <a class="btn btn-outline btn-large" href="shop.html">Continue shopping</a>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bar">
      <a href="index.html"><img src="images/logo-white.svg" alt="NUQTA home" width="185" height="36"></a>
      <p>Copyright &copy; 2026 NUQTA.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      startCartPage();
    });
  </script>
</body>
</html>
