<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | NUQTA Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="navbar">
      <a class="logo" href="index.html"><img src="images/logo.svg" alt="NUQTA home"></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Products</a></li>
        <li><a href="trade-in.html">Sell Laptop</a></li>
        <li><a href="about.html">About us</a></li>
      </ul>
      <div class="nav-actions">
        <form id="search-form" class="search-form" role="search" method="get" action="shop.html">
          <label for="search-input" class="visually-hidden">Search products</label>
          <input id="search-input" type="search" name="q">
        </form>
        <a class="header-pill" href="cart.html" aria-label="Shopping cart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.5"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><span id="cart-count">(0)</span></a>
        <a class="header-pill" id="account-link" href="login.html">Log in</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="details">
        <div class="details-image">
          <img src="images/placeholder.svg" alt="Product Image">
        </div>
        <div class="details-info">
          <h1>Loading product...</h1>
          <p class="description"></p>
          <p class="rating-line">5.0 <span class="small-stars">★★★★★</span> <span class="reviews">(0)</span></p>

          <ul class="spec-list"></ul>

          <label class="qty-control" for="qty-count">
            Quantity <input type="number" id="qty-count" name="quantity" value="1" min="1" max="99">
          </label>

          <div class="buy-row">
            <p class="price" id="detail-price">... USD</p>
            <button type="button" class="btn btn-primary" id="details-add" onclick="handleAddProductDetail()">Add to cart</button>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <section id="reviews-section" style="margin-top:60px">
        <h2 class="page-title">Customer Reviews &amp; Ratings</h2>

        <div class="two-columns" style="gap:40px; margin-top:30px;">
          <!-- Reviews list -->
          <div id="reviews-list">
            <p>Loading reviews...</p>
          </div>

          <!-- Write a Review Form -->
          <div class="panel" style="padding:30px;">
            <h3 style="font-size:28px; margin-bottom:20px;">Write a Review</h3>
            <form id="write-review-form" onsubmit="submitReview(event)">
              <div class="form-field">
                <label for="review-rating">Rating (1 to 5 Stars)</label>
                <select id="review-rating" required style="font-size:18px;">
                  <option value="5">★★★★★ (5 Stars - Excellent)</option>
                  <option value="4">★★★★☆ (4 Stars - Good)</option>
                  <option value="3">★★★☆☆ (3 Stars - Average)</option>
                  <option value="2">★★☆☆☆ (2 Stars - Poor)</option>
                  <option value="1">★☆☆☆☆ (1 Star - Bad)</option>
                </select>
              </div>
              <div class="form-field">
                <label for="review-text">Your Comments</label>
                <textarea id="review-text" required placeholder="Share your experience with this device..." style="height:120px; font-size:18px;"></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-block">Submit Review</button>
            </form>
          </div>
        </div>
      </section>

      <!-- Similar products -->
      <section style="margin-top:70px">
        <h2 class="page-title">Similar products</h2>
        <div class="product-grid similar-grid">
          <p>Loading recommendations...</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bar">
      <a href="index.html"><img src="images/logo-white.svg" alt="NUQTA home" width="185" height="36"></a>
      <p>Copyright &copy; 2026 NUQTA.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
  <script>
    let activeProdId = Number(getUrlParam('id')) || 1;

    function handleAddProductDetail() {
      addDetailToCart(activeProdId);
    }

    function submitReview(event) {
      handleReviewSubmit(event, activeProdId);
    }

    document.addEventListener('DOMContentLoaded', () => {
      startProductPage(activeProdId);
    });
  </script>
</body>
</html>
